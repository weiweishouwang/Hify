# 密钥模板 —— **不要直接用这个文件**，照着它建自己的 Secret。
#
#   kubectl -n hify create secret generic hify-secret \
#     --from-literal=HIFY_DB_PASSWORD='...' \
#     --from-literal=HIFY_DB_ROOT_PASSWORD='...' \
#     --from-literal=HIFY_PG_PASSWORD='...' \
#     --from-literal=HIFY_REDIS_PASSWORD='...' \
#     --from-literal=HIFY_CREDENTIAL_ENCRYPTION_KEY='...'
#
# 提醒：
#   · Secret 是 base64 编码，不是加密。K8s 1.21+ 默认开了 etcd 静态加密，
#     但更稳的做法是用 External Secrets Operator 从密钥平台同步（部署规格 §7.2）。
#   · HIFY_CREDENTIAL_ENCRYPTION_KEY 是 Base64 编码的 32 字节，用来给接入点、
#     工具、MCP 服务的凭据做 AES-GCM 加密。**它一换，历史密文就解不开了** ——
#     封套的 keyId 绑在 AAD 上，改不得。生成：openssl rand -base64 32
#   · 这个文件里的值是假值，只用来让清单能过 kubectl 的 dry-run。
apiVersion: v1
kind: Secret
metadata:
  name: hify-secret
  namespace: hify
type: Opaque
stringData:
  HIFY_DB_PASSWORD: "CHANGE_ME"
  HIFY_DB_ROOT_PASSWORD: "CHANGE_ME"
  HIFY_PG_PASSWORD: "CHANGE_ME"
  HIFY_REDIS_PASSWORD: ""
  HIFY_CREDENTIAL_ENCRYPTION_KEY: "Q0hBTkdFX01FX0Jhc2U2NF9ieXRlcyE9PT0="
