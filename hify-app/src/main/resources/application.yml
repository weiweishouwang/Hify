# Hify 应用配置
#
# 配置单一来源：开发用 Docker Compose、生产用 Kubernetes，两者注入同一套环境变量名，
# 因此本文件在两边通用——本地不设环境变量时全部走默认值（localhost），
# 生产由 ConfigMap / Secret 覆盖同名变量。
#
# 生产覆盖示例：
#   HIFY_DB_HOST=mysql.hify.svc
#   HIFY_DB_PASSWORD=<来自 Secret>

server:
  port: 8080
  # 优雅停机：SSE 长连接需要时间推完，避免滚动更新掐断对话
  shutdown: graceful
  # 信任前置代理（Ingress / nginx）转发的协议与客户端 IP。
  # 不设的话后端会把所有请求当成 http、客户端 IP 全是代理的地址。
  forward-headers-strategy: framework
  tomcat:
    threads:
      # 保持默认 200 不调低（CLAUDE.md §1.4、部署规格 §13.1）：
      # 正常路径 SSE 不占 Tomcat 线程，这 200 是最后一道缓冲——
      # 一旦某处漏了 offload，让故障以「变慢」而不是「全面拒绝服务」的形式暴露。
      max: 200

spring:
  application:
    name: hify

  mvc:
    # 异步请求的超时。默认 30s 会掐断任何跑得更久的异步请求：
    # 工作流的运行接口用 DeferredResult（不是 SseEmitter，没有自己的超时保护），
    # 对话流虽然 emitter 带了 600s，这里仍要留够（CLAUDE.md §3.4）。
    async:
      request-timeout: 30m

  # 入站请求体的上限。默认 256KB，知识库上传 TXT 时容易超。
  codec:
    max-in-memory-size: 2MB

  web:
    resources:
      # 关掉 Spring Boot 的默认静态资源映射：它也注册在 /** 上，
      # 后注册的会顶掉先注册的，回落行为就成了装配顺序的运气。
      # 关掉后那几个标准位置由 hify-app 的 StaticResourceConfig 补回来。
      add-mappings: false

  # ── 业务库：MySQL ─────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${HIFY_DB_HOST:localhost}:${HIFY_DB_PORT:3306}/${HIFY_DB_NAME:hify}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${HIFY_DB_USERNAME:hify}
    password: ${HIFY_DB_PASSWORD:hify}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: hify-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # 持有超过 60s 即告警——正常请求不该持有这么久，常见于流式期间漏释放
      leak-detection-threshold: 60000
      max-lifetime: 1700000

  # ── 缓存与协调：Redis ─────────────────────────────────────────
  # 限流计数、分布式锁、幂等键都在这里，不能用本地缓存（多副本会不一致）
  data:
    redis:
      host: ${HIFY_REDIS_HOST:localhost}
      port: ${HIFY_REDIS_PORT:6379}
      database: ${HIFY_REDIS_DATABASE:0}
      password: ${HIFY_REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  lifecycle:
    # 优雅停机的等待窗口。要 ≥ K8s 的 terminationGracePeriodSeconds（180s），
    # 否则 Spring 先退完、容器再强杀 —— 表现为「滚动更新时对话被拦腰截断」。
    timeout-per-shutdown-phase: 180s

  jackson:
    # 时间格式由 shared 的 JacksonConfig 统一成 ISO 8601
    # （LocalDateTime → 2026-10-30T15:52:42，LocalDate → 2026-10-30），
    # 这里不要再配 date-format：那个只管 java.util.Date，配了会跟 ISO 格式分叉。
    time-zone: UTC
    default-property-inclusion: non_null

# ── 向量库：PostgreSQL + pgvector ─────────────────────────────────
# 知识库的分段正文与向量存在这里，与业务库（MySQL）是两套数据，
# 靠 kb_id / doc_id 逻辑关联，跨库无外键。
# 这个数据源由 hify-knowledge 的 internal/config 创建（走 JdbcTemplate，
# 不与 MyBatis-Plus 混用），此处只提供连接参数。
hify:
  ai:
    provider-health:
      # 每分钟只读目录探测，不发起模型推理；可显式关闭。
      enabled: ${HIFY_PROVIDER_HEALTH_ENABLED:true}

  # ── 跨域 ──────────────────────────────────────────────────────
  # 什么时候才需要：部署方案 A（Ingress 把 /api 直接路由到 hify-api）下
  # 前后端不同源，浏览器会拦下跨域请求，这时 api 侧必须配。
  # 方案 B（nginx 反代，前后端同源）与开发环境都不需要 —— 所以默认为空 = 关闭。
  cors:
    allowed-origins: ${HIFY_CORS_ALLOWED_ORIGINS:}

  # ── 静态资源与单页应用回落 ─────────────────────────────────────
  app:
    static:
      enabled: ${HIFY_STATIC_ENABLED:true}
      # 单页应用的入口页：找不到静态文件时回落到它
      index-page: index.html
      locations:
        - classpath:/static/
        - classpath:/public/
        - classpath:/resources/
        - classpath:/META-INF/resources/
        # 外部目录：把前端产物挂进来，单容器部署时不用再维护一个 nginx。
        # 留空则忽略（装配时跳过空位置）。
        - ${HIFY_STATIC_LOCATION:}

  vector:
    datasource:
      url: jdbc:postgresql://${HIFY_PG_HOST:localhost}:${HIFY_PG_PORT:5432}/${HIFY_PG_NAME:hify}
      username: ${HIFY_PG_USERNAME:hify}
      password: ${HIFY_PG_PASSWORD:hify}
      driver-class-name: org.postgresql.Driver
      hikari:
        pool-name: hify-vector-pool
        maximum-pool-size: 8
        minimum-idle: 1
        connection-timeout: 3000
        leak-detection-threshold: 60000
        max-lifetime: 1700000

  # ── 熔断器（Resilience4j）────────────────────────────────────────
  # 调上游 LLM 时按 provider 独立计数：某个 provider 连续出问题就单独把它断开，
  # 不影响其他 provider。参数对应 Resilience4j 的 CircuitBreakerConfig。
  resilience:
    circuit-breaker:
      # 滑动窗口记最近 10 次调用
      sliding-window-size: 10
      # 窗口内失败率超过 50% 就打开熔断
      failure-rate-threshold: 50
      # 打开后等 30 秒进入半开状态
      wait-duration-in-open-state: 30s
      # 半开状态允许 3 次试探调用，全成功才回到闭合
      permitted-number-of-calls-in-half-open-state: 3

# ── MyBatis-Plus ────────────────────────────────────────────────
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
  # 不配置 logic-delete-field：BaseDO 里刻意没有 deletedAt，
  # 因为 @TableLogic 会给每条 SQL 追加 deleted_at IS NULL，破坏事件流表（分区表）的分区裁剪。
  # 需要软删的表在自己的 DO 上单独声明。

# ── 可观测性 ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
        # 不要加 env / heapdump / threaddump / configprops：
        # env 会把环境变量里的密钥暴露出去。
  endpoint:
    info:
      # 版本信息由 spring-boot-maven-plugin 的 build-info goal 生成，
      # 落在 jar 里的 META-INF/build-info.properties，/actuator/info 直接能读到。
      enabled: true
    health:
      probes:
        enabled: true
      group:
        # MySQL 挂了就读不到 Agent 配置，等于在服务一个必然失败的请求 —— 必须摘流量
        readiness:
          include: readinessState,db
        # liveness 只看进程自身：依赖抖动不该触发重启（重启也修不好，还掐断所有 SSE）
        liveness:
          include: livenessState
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: hify

logging:
  pattern:
    # %X{traceId} 对应 shared 的 TraceContext.MDC_KEY
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    root: INFO
    com.hify: INFO
